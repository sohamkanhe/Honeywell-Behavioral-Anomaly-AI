<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UEBA SOC Analyst - React.js AI Behavioral Anomaly Detection</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  
  <!-- React 18 & ReactDOM 18 & Babel Local Libraries -->
  <script src="/static/js/react.min.js"></script>
  <script src="/static/js/react-dom.min.js"></script>
  <script src="/static/js/babel.min.js"></script>
  
  <style>
    :root {
      --bg-dark: #0F172A;
      --panel-bg: #1E293B;
      --panel-border: #334155;
      --text-main: #F8FAFC;
      --text-muted: #94A3B8;
      --accent-cyan: #38BDF8;
      --accent-blue: #60A5FA;
      --accent-magenta: #F0ABFC;
      --accent-red: #F87171;
      --accent-amber: #FBBF24;
      --accent-purple: #C084FC;
      --accent-green: #4ADE80;
      --card-bg: #1E293B;
      --input-bg: #0F172A;
      --input-border: #475569;
      --table-header-bg: #334155;
      --table-hover: rgba(56, 189, 248, 0.1);
      --table-selected: rgba(56, 189, 248, 0.2);
      --taxonomy-bg: #334155;
      --font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    body.light-theme {
      --bg-dark: #F1F5F9;
      --panel-bg: #FFFFFF;
      --panel-border: #CBD5E1;
      --text-main: #0F172A;
      --text-muted: #475569;
      --accent-cyan: #0284C7;
      --accent-blue: #2563EB;
      --accent-magenta: #A21CAF;
      --accent-red: #DC2626;
      --accent-amber: #D97706;
      --accent-purple: #7C3AED;
      --accent-green: #15803D;
      --card-bg: #FFFFFF;
      --input-bg: #F8FAFC;
      --input-border: #94A3B8;
      --table-header-bg: #E2E8F0;
      --table-hover: rgba(2, 132, 199, 0.08);
      --table-selected: rgba(2, 132, 199, 0.16);
      --taxonomy-bg: #E2E8F0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-family);
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    #root {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
    }

    /* Header Bar */
    .app-header {
      padding: 12px 24px;
      height: 60px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--panel-border);
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      flex-shrink: 0;
    }

    .sidebar-toggle-btn {
      background: var(--input-bg);
      border: 1px solid var(--panel-border);
      color: var(--text-main);
      font-size: 16px;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .sidebar-toggle-btn:hover {
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
    }

    .brand-title {
      font-size: 18px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--text-main);
    }

    .brand-badge {
      font-size: 10px;
      font-family: var(--font-mono);
      font-weight: 700;
      color: var(--accent-cyan);
      background: var(--table-selected);
      border: 1px solid var(--accent-cyan);
      padding: 2px 8px;
      border-radius: 12px;
    }

    /* Layout Wrapper */
    .layout-wrapper {
      display: flex;
      flex: 1;
      height: calc(100vh - 60px);
      overflow: hidden;
    }

    /* Sidebar Styling (Collapsible) */
    .sidebar {
      width: 260px;
      background: var(--panel-bg);
      border-right: 1px solid var(--panel-border);
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      flex-shrink: 0;
      transition: all 0.3s ease;
      overflow-y: auto;
    }

    .sidebar-section-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
    }
    .nav-item:hover, .nav-item.active {
      background: var(--table-selected);
      color: var(--accent-cyan);
    }

    .search-box {
      width: 100%;
      padding: 9px 12px;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 6px;
      color: var(--text-main);
      font-size: 12px;
      font-family: var(--font-family);
      outline: none;
    }
    .search-box:focus {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 0 2px var(--table-selected);
    }

    .select-control {
      width: 100%;
      padding: 9px 12px;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 6px;
      color: var(--text-main);
      font-size: 12px;
      font-family: var(--font-family);
      outline: none;
      cursor: pointer;
    }
    .select-control option {
      background: var(--panel-bg);
      color: var(--text-main);
    }

    .theme-toggle-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px;
      border-radius: 6px;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      color: var(--text-main);
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
      width: 100%;
    }
    .theme-toggle-btn:hover {
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
    }

    /* Content Area */
    .content-area {
      flex: 1;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      overflow-y: auto;
      overflow-x: hidden;
    }

    .glass-panel {
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--panel-border);
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }

    /* Metrics Bar */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }
    @media (max-width: 900px) {
      .metrics-grid { grid-template-columns: repeat(2, 1fr); }
    }

    .metric-card {
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      position: relative;
      overflow: hidden;
      border-radius: 8px;
      border: 1px solid var(--panel-border);
      background: var(--panel-bg);
    }
    .metric-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
      background: var(--accent-cyan);
    }
    .metric-card.critical::before { background: var(--accent-red); }
    .metric-card.warning::before { background: var(--accent-amber); }
    .metric-card.green::before { background: var(--accent-green); }

    .metric-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .metric-value {
      font-size: 26px;
      font-weight: 800;
      font-family: var(--font-mono);
      color: var(--text-main);
    }

    /* Dashboard Split View */
    .dashboard-grid {
      display: grid;
      grid-template-columns: 1fr 440px;
      gap: 20px;
    }
    @media (max-width: 1200px) {
      .dashboard-grid { grid-template-columns: 1fr; }
    }

    /* Taxonomy Bar Pills - Vibrant and Readable in Both Themes */
    .taxonomy-bar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .taxonomy-pill {
      font-size: 12px;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 20px;
      background: var(--taxonomy-bg);
      border: 1px solid var(--panel-border);
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .taxonomy-pill:hover, .taxonomy-pill.active {
      border-color: var(--accent-cyan);
      background: var(--table-selected);
      color: var(--accent-cyan);
    }
    .taxonomy-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
    }

    /* Table Styling - Clean Overflow & High-Contrast Colors */
    .table-container {
      overflow-x: auto;
      border-radius: 8px;
      max-height: 520px;
      overflow-y: auto;
      border: 1px solid var(--panel-border);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 12px;
      table-layout: auto;
    }

    th {
      background: var(--table-header-bg);
      color: var(--text-main);
      font-weight: 700;
      text-transform: uppercase;
      font-size: 11px;
      letter-spacing: 0.8px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--panel-border);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    td {
      padding: 11px 14px;
      border-bottom: 1px solid var(--panel-border);
      color: var(--text-main);
    }

    tr {
      cursor: pointer;
      transition: background 0.15s;
    }
    tr:hover {
      background: var(--table-hover);
    }
    tr.selected-row {
      background: var(--table-selected) !important;
      border-left: 3px solid var(--accent-cyan);
    }

    /* Badges */
    .risk-badge {
      font-family: var(--font-mono);
      font-weight: 800;
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 4px;
      display: inline-block;
    }
    .risk-critical { background: rgba(239, 68, 68, 0.15); color: var(--accent-red); border: 1px solid var(--accent-red); }
    .risk-high { background: rgba(245, 158, 11, 0.15); color: var(--accent-amber); border: 1px solid var(--accent-amber); }
    .risk-medium { background: rgba(2, 132, 199, 0.15); color: var(--accent-cyan); border: 1px solid var(--accent-cyan); }
    .risk-low { background: rgba(22, 163, 74, 0.15); color: var(--accent-green); border: 1px solid var(--accent-green); }

    .status-badge {
      font-size: 10px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 12px;
      text-transform: uppercase;
    }
    .status-new { background: rgba(239, 68, 68, 0.15); color: var(--accent-red); border: 1px solid var(--accent-red); }
    .status-ack { background: rgba(22, 163, 74, 0.15); color: var(--accent-green); border: 1px solid var(--accent-green); }

    .threat-tag {
      font-weight: 700;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .tag-impossible_travel { background: rgba(239, 68, 68, 0.15); color: var(--accent-red); border: 1px solid var(--accent-red); }
    .tag-lateral_movement { background: rgba(192, 38, 211, 0.15); color: var(--accent-magenta); border: 1px solid var(--accent-magenta); }
    .tag-brute_force { background: rgba(217, 119, 6, 0.15); color: var(--accent-amber); border: 1px solid var(--accent-amber); }
    .tag-credential_stuffing { background: rgba(234, 88, 12, 0.15); color: #EA580C; border: 1px solid #EA580C; }
    .tag-low_and_slow_exfiltration { background: rgba(124, 58, 237, 0.15); color: var(--accent-purple); border: 1px solid var(--accent-purple); }
    .tag-device_spoofing { background: rgba(2, 132, 199, 0.15); color: var(--accent-cyan); border: 1px solid var(--accent-cyan); }
    .tag-insider_drift { background: rgba(37, 99, 235, 0.15); color: var(--accent-blue); border: 1px solid var(--accent-blue); }

    /* Table Row Action Button */
    .btn-table-ack {
      background: var(--accent-green);
      color: #FFFFFF;
      border: none;
      padding: 4px 10px;
      border-radius: 4px;
      font-weight: 800;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-table-ack:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }
    .btn-table-acked {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--panel-border);
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
      cursor: default;
    }

    /* XAI Side Panel */
    .xai-panel {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .shap-bar-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 10px;
    }

    .shap-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 11px;
    }

    .shap-label-row {
      display: flex;
      justify-content: space-between;
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-weight: 600;
    }

    .shap-bar-track {
      height: 8px;
      background: var(--input-bg);
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid var(--panel-border);
    }

    .shap-bar-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.4s ease-out;
    }
    .shap-positive { background: linear-gradient(90deg, var(--accent-amber), var(--accent-red)); }
    .shap-negative { background: linear-gradient(90deg, var(--accent-blue), var(--accent-green)); }

    /* Timeline Section */
    .timeline-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 10px;
      max-height: 200px;
      overflow-y: auto;
    }
    .timeline-item {
      display: flex;
      padding: 10px 12px;
      background: var(--input-bg);
      border-left: 3px solid var(--accent-cyan);
      border-radius: 0 6px 6px 0;
      font-size: 11px;
      border-top: 1px solid var(--panel-border);
      border-right: 1px solid var(--panel-border);
      border-bottom: 1px solid var(--panel-border);
    }

    /* Analytics Charts Section */
    .charts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 16px;
    }

    .chart-card {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .chart-bar-row {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      margin-bottom: 8px;
    }
    .chart-bar-label {
      width: 140px;
      color: var(--text-muted);
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .chart-bar-bg {
      flex: 1;
      height: 12px;
      background: var(--input-bg);
      border: 1px solid var(--panel-border);
      border-radius: 6px;
      overflow: hidden;
    }
    .chart-bar-val {
      height: 100%;
      border-radius: 6px;
      background: linear-gradient(90deg, var(--accent-cyan), var(--accent-magenta));
    }
  </style>
</head>
<body>
  <!-- React Mount Point -->
  <div id="root">
    <div style="text-align: center; padding: 100px; color: #8A99AD; font-family: sans-serif;">
      Loading React.js Security Operations Center Dashboard...
    </div>
  </div>

  <!-- Load React Component App -->
  <script type="text/babel" src="/static/app.jsx"></script>
</body>
</html>
